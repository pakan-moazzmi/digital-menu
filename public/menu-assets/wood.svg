<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" preserveAspectRatio="none">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.11" numOctaves="4" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.27  0 0 0 0 0.10  2.4 0 0 0 -0.95"/>
    </filter>
    <filter id="fine" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0009 0.45" numOctaves="2" seed="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.02  0 0 0 0 0.01  -2.2 0 0 0 1.25"/>
    </filter>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.012" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="0.03" stop-color="#fff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="#2A1710"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.45"/>
  <rect width="1200" height="1200" filter="url(#fine)" opacity="0.4"/>
  <g>
    <rect y="0" width="1200" height="300" fill="url(#plank)"/>
    <rect y="300" width="1200" height="300" fill="url(#plank)"/>
    <rect y="600" width="1200" height="300" fill="url(#plank)"/>
    <rect y="900" width="1200" height="300" fill="url(#plank)"/>
  </g>
</svg>